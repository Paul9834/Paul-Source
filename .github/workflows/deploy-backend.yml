name: Deploy Backend to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Find built JAR
        run: |
          JAR_PATH=$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*.jar' | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No JAR file found in target/"
            exit 1
          fi
          echo "JAR_PATH=$JAR_PATH" >> $GITHUB_ENV

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ${{ env.JAR_PATH }}
          target: /opt/paul-source/
          strip_components: 1

      - name: Restart backend service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/paul-source
            JAR_FILE=$(find /opt/paul-source -maxdepth 1 -type f -name '*.jar' ! -name 'original-*.jar' | head -n 1)
            if [ -z "$JAR_FILE" ]; then
              echo "No deployed JAR found in /opt/paul-source"
              exit 1
            fi
            sudo mv "$JAR_FILE" /opt/paul-source/app.jar
            sudo chown root:root /opt/paul-source/app.jar
            sudo chmod 644 /opt/paul-source/app.jar
            sudo systemctl restart paul-source
            sudo systemctl status paul-source --no-pager
